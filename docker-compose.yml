services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: banco_cast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8520:8520"
    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  postgres_data: